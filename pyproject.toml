[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morocco-electoral-analytics"
version = "0.0.0.dev0"
description = "Read-only analytical marts for Morocco electoral and parliamentary data"
requires-python = ">=3.11,<3.13"
dependencies = [
  "duckdb==1.5.5",
]

[project.scripts]
morocco-elections = "morocco_elections.analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["archive", "data", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
