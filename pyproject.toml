[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morocco-electoral-warehouse"
version = "12.0.0"
description = "Reproducible pipelines and quality contracts for the Morocco electoral warehouse"
requires-python = ">=3.11,<3.12"
dependencies = [
  "openpyxl==3.1.5",
  "pandas==2.2.3",
]

[project.scripts]
morocco-elections = "morocco_elections.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
