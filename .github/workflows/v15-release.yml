name: V15 release promotion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish-draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps --editable .
      - name: Download the exact draft asset announced by the contract
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download v15.0.0 --pattern Morocco_Electoral_Data_Warehouse_V15.zip --dir "$RUNNER_TEMP/release"
      - name: Verify announced bytes and SHA-256
        run: |
          python -c "import hashlib,json,os,pathlib; m=json.load(open('metadata/v15_publication.json')); p=pathlib.Path(os.environ['RUNNER_TEMP'])/'release'/m['asset_name']; assert p.stat().st_size==m['bytes']; assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']"
      - name: Validate the release candidate through the real network-only bootstrap
        env:
          MOROCCO_ELECTIONS_V15_URL: file://${{ runner.temp }}/release/Morocco_Electoral_Data_Warehouse_V15.zip
        run: |
          python -m morocco_elections bootstrap --network-only --data-dir "$RUNNER_TEMP/consumer"
          python -m morocco_elections validate --mode public --data-dir "$RUNNER_TEMP/consumer"
          python -m morocco_elections analyze reference --format json --data-dir "$RUNNER_TEMP/consumer"
      - name: Publish only after every release gate passes
        run: gh release edit v15.0.0 --draft=false --latest
