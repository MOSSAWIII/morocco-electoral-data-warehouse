name: publish v1.0.0

on:
  push:
    tags:
      - v1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the identified clean release state
        shell: bash
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "v1.0.0"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Verify code and tests
        run: |
          python -m compileall -q src
          ruff check .
          pytest

      - name: Build and enforce all publication gates
        run: |
          morocco-elections build --output "$RUNNER_TEMP/warehouse"
          morocco-elections validate --package "$RUNNER_TEMP/warehouse"
          morocco-elections audit --package "$RUNNER_TEMP/warehouse" --summary --require-ready

      - name: Create release archive only after readiness
        run: |
          morocco-elections package \
            --package "$RUNNER_TEMP/warehouse" \
            --output "$RUNNER_TEMP/morocco-electoral-data-warehouse-v1.0.0.zip"

      - name: Upload gated artifact
        uses: actions/upload-artifact@v4
        with:
          name: morocco-electoral-data-warehouse-v1.0.0
          path: ${{ runner.temp }}/morocco-electoral-data-warehouse-v1.0.0.zip
          if-no-files-found: error
