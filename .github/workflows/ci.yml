name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Validate historical repository contracts without data
        run: python -m morocco_elections validate --mode ci

  v15-public-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Bootstrap V15 from the public network asset in an empty data directory
        run: python -m morocco_elections bootstrap --network-only --data-dir "$RUNNER_TEMP/v15-consumer"

      - name: Validate the public V15 package
        run: python -m morocco_elections validate --mode public --data-dir "$RUNNER_TEMP/v15-consumer"

      - name: Execute all five V15 analyses
        run: python -m morocco_elections analyze reference --format json --data-dir "$RUNNER_TEMP/v15-consumer"

      - name: Exercise the real package mutation suite
        env:
          V15_TEST_PACKAGE: ${{ runner.temp }}/v15-consumer/exports/open/v15
        run: pytest tests/integration/test_v15_package_mutations.py tests/integration/test_v15_release_contract.py
