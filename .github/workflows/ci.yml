name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Validate repository without data
        run: python -m morocco_elections validate --mode ci
