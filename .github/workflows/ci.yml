name: canonical warehouse

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Compile and lint
        run: |
          python -m compileall -q src
          ruff check .

      - name: Unit tests
        run: pytest tests/unit

      - name: Build canonical package from pinned sources
        run: morocco-elections build --output "$RUNNER_TEMP/warehouse"

      - name: Validate and audit package
        run: |
          morocco-elections validate --package "$RUNNER_TEMP/warehouse"
          morocco-elections audit --package "$RUNNER_TEMP/warehouse" --summary

      - name: Essential integration and mutation tests
        env:
          WAREHOUSE_TEST_PACKAGE: ${{ runner.temp }}/warehouse
        run: |
          pytest tests/integration/test_canonical_cli.py tests/integration/test_warehouse_seed_audit.py
          pytest tests/unit/test_warehouse_package.py tests/unit/test_warehouse_reconciliation_matrix.py

      - name: Verify no source or generated drift
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Compact CI summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Morocco Electoral Data Warehouse'
            echo
            morocco-elections status --package "$RUNNER_TEMP/warehouse" || true
          } >> "$GITHUB_STEP_SUMMARY"
