name: V15 pull request proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-public-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps --editable .
      - run: ruff check .
      - run: pytest tests/unit
      - name: Build from the pinned public V14.1 distribution in an empty data directory
        run: python -m morocco_elections build v15 --data-dir "$RUNNER_TEMP/v15-data"
      - run: python -m morocco_elections validate --mode public --data-dir "$RUNNER_TEMP/v15-data"
      - run: python -m morocco_elections analyze reference --format json --data-dir "$RUNNER_TEMP/v15-data"
      - name: Exercise production package mutations
        env:
          V15_TEST_PACKAGE: ${{ runner.temp }}/v15-data/exports/open/v15
        run: pytest tests/integration/test_v15_package_mutations.py tests/integration/test_v15_release_contract.py
      - name: Prove deterministic rebuild
        run: |
          cp "$RUNNER_TEMP/v15-data/exports/open/releases/Morocco_Electoral_Data_Warehouse_V15.zip" "$RUNNER_TEMP/first.zip"
          python -m morocco_elections build v15 --data-dir "$RUNNER_TEMP/v15-data" --output-dir "$RUNNER_TEMP/v15-second"
          python scripts/verify_v15_reproducibility.py \
            "$RUNNER_TEMP/v15-data/exports/open/v15" "$RUNNER_TEMP/v15-second" \
            "$RUNNER_TEMP/first.zip" "$RUNNER_TEMP/v15-data/exports/open/releases/Morocco_Electoral_Data_Warehouse_V15.zip"
      - name: Prove the independently published consumer path
        run: |
          python -m morocco_elections bootstrap --network-only --data-dir "$RUNNER_TEMP/v15-network-consumer"
          python -m morocco_elections validate --mode public --data-dir "$RUNNER_TEMP/v15-network-consumer"
          python -m morocco_elections analyze reference --format json --data-dir "$RUNNER_TEMP/v15-network-consumer"
