name: analytics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Compile and lint
        run: |
          python -m compileall -q src
          ruff check .

      - name: Autonomous tests
        run: pytest

      - name: Create synthetic canonical fixture
        run: python tests/create_canonical_fixture.py "$RUNNER_TEMP/canonical.duckdb"

      - name: Double analytics build
        run: |
          morocco-elections build --source "$RUNNER_TEMP/canonical.duckdb" --output "$RUNNER_TEMP/analytics-first.duckdb"
          morocco-elections build --source "$RUNNER_TEMP/canonical.duckdb" --output "$RUNNER_TEMP/analytics-second.duckdb"

      - name: Validate, compare, and execute examples
        env:
          FIRST: ${{ runner.temp }}/analytics-first.duckdb
          SECOND: ${{ runner.temp }}/analytics-second.duckdb
        run: |
          morocco-elections validate --database "$FIRST"
          morocco-elections validate --database "$SECOND"
          python - <<'PY'
          import os
          from pathlib import Path
          import duckdb
          from morocco_elections.analytics.contracts import MART_CONTRACTS

          connection = duckdb.connect()
          connection.execute(f"ATTACH '{os.environ['FIRST']}' AS first (READ_ONLY)")
          connection.execute(f"ATTACH '{os.environ['SECOND']}' AS second (READ_ONLY)")
          for table in MART_CONTRACTS:
              for left, right in (("first", "second"), ("second", "first")):
                  count = connection.execute(
                      f"SELECT count(*) FROM ((SELECT * FROM {left}.{table}) EXCEPT ALL (SELECT * FROM {right}.{table}))"
                  ).fetchone()[0]
                  assert count == 0, (table, left, right, count)
          connection.close()

          connection = duckdb.connect(os.environ["FIRST"], read_only=True)
          queries = sorted(Path("examples/analytics").glob("*.sql"))
          assert len(queries) == 6
          for query in queries:
              connection.execute(query.read_text(encoding="utf-8")).fetchall()
          connection.close()
          PY

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain --untracked-files=all)"
